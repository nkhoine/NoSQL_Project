<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Khách hàng thân thiết - QLCafe</title></head>
<body>
<section class="pb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h3 class="fw-bold mb-0">🎁 Khách hàng thân thiết</h3>
            <small class="text-muted">Tìm kiếm khách hàng và tích điểm Atomic ($inc)</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalThem">+ Thêm khách hàng</button>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Tìm kiếm -->
    <form class="row g-2 mb-3" method="get" th:action="@{/khachhang}">
        <div class="col-md-5">
            <input name="keyword" class="form-control" th:value="${keyword}" placeholder="Tìm theo mã, tên hoặc số điện thoại...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a th:href="@{/khachhang}" class="btn btn-outline-secondary">Tất cả</a>
        </div>
    </form>

    <!-- Bảng khách hàng -->
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã KH</th>
                    <th>Tên khách hàng</th>
                    <th>Số điện thoại</th>
                    <th class="text-end">Điểm tích lũy</th>
                    <th>Cộng điểm nhanh ($inc)</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="kh : ${dsKhachHang}">
                    <td class="fw-bold" th:text="${kh['Makh']}">kh01</td>
                    <td th:text="${kh['Tenkh']}">Tên KH</td>
                    <td th:text="${kh['Dienthoai']}">0912000001</td>
                    <td class="text-end fw-bold text-primary" th:text="${kh['Diem']}">0</td>
                    <td>
                        <form class="d-flex gap-1" method="post" th:action="@{/khachhang/congdiem}">
                            <input type="hidden" name="makh" th:value="${kh['Makh']}">
                            <input type="number" name="diemCong" value="5" class="form-control form-control-sm" style="width:80px" required>
                            <button type="submit" class="btn btn-sm btn-outline-success">+ Điểm</button>
                        </form>
                    </td>
                    <td class="text-end text-nowrap">
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                th:attr="data-makh=${kh['Makh']},data-tenkh=${kh['Tenkh']},data-dienthoai=${kh['Dienthoai']},data-diem=${kh['Diem']}"
                                onclick="moSuaKH(this)">Sửa</button>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{/khachhang/xoa/{ma}(ma=${kh['Makh']})}"
                           onclick="return confirm('Xóa khách hàng này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(dsKhachHang)}">
                    <td colspan="6" class="text-center text-muted">Không tìm thấy khách hàng nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal thêm -->
    <div class="modal fade" id="modalThem" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/khachhang/them}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm khách hàng mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Mã KH</label>
                        <input name="makh" class="form-control" placeholder="vd: kh06" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Tên khách hàng</label>
                        <input name="tenkh" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Số điện thoại</label>
                        <input name="dienthoai" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Điểm ban đầu</label>
                        <input type="number" name="diem" class="form-control" value="0" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Lưu khách hàng</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal sửa -->
    <div class="modal fade" id="modalSua" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/khachhang/sua}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Cập nhật khách hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Mã KH</label>
                        <input name="makh" id="suaMakh" class="form-control" readonly>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Tên khách hàng</label>
                        <input name="tenkh" id="suaTenkh" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Số điện thoại</label>
                        <input name="dienthoai" id="suaDienthoai" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-semibold">Điểm tích lũy</label>
                        <input type="number" name="diem" id="suaDiem" class="form-control" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function moSuaKH(btn) {
            document.getElementById('suaMakh').value = btn.dataset.makh;
            document.getElementById('suaTenkh').value = btn.dataset.tenkh;
            document.getElementById('suaDienthoai').value = btn.dataset.dienthoai;
            document.getElementById('suaDiem').value = btn.dataset.diem;
            new bootstrap.Modal(document.getElementById('modalSua')).show();
        }
    </script>
</section>
</body>
</html>
