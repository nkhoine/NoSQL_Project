<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Sơ đồ bàn - QLCafe</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">🪑 Sơ đồ bàn</h3>
        <div>
            <a href="/banhang" class="btn btn-primary">🛒 Vào POS</a>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalThem">+ Thêm bàn</button>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="mb-3 small">
        <span class="badge bg-success">Trống</span>
        <span class="badge bg-danger">Có khách</span>
    </div>

    <!-- Bàn theo khu vực -->
    <div th:each="kv : ${dsKhuVuc}" class="mb-4">
        <h5 class="fw-bold border-bottom pb-1" th:text="${kv}">Khu vực</h5>
        <div class="row g-3">
            <div class="col-6 col-md-3" th:each="b : ${dsBan}" th:if="${b['Khuvuc'] == kv}">
                <div class="card shadow-sm h-100"
                     th:classappend="${b['Trangthai'] == 'Trống'} ? 'border-success' : 'border-danger'">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h6 class="fw-bold mb-1" th:text="${b['Tenban']}">Bàn</h6>
                            <span class="badge"
                                  th:classappend="${b['Trangthai'] == 'Trống'} ? 'bg-success' : 'bg-danger'"
                                  th:text="${b['Trangthai']}">Trống</span>
                        </div>
                        <div class="text-muted small mb-2">
                            <span th:text="${b['Maban']}">b01</span>
                            <span th:if="${b['Mahd'] != null}" th:text="' · ' + ${b['Mahd']}"></span>
                        </div>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/banhang(maban=${b['Maban']})}">
                            <span th:text="${b['Trangthai'] == 'Trống'} ? 'Mở bàn' : 'Xem hóa đơn'">Mở bàn</span>
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                th:attr="data-maban=${b['Maban']},data-tenban=${b['Tenban']},data-khuvuc=${b['Khuvuc']}"
                                onclick="moSua(this)">Sửa</button>
                        <a class="btn btn-sm btn-outline-danger" th:if="${b['Trangthai'] == 'Trống'}"
                           th:href="@{/ban/xoa/{ma}(ma=${b['Maban']})}"
                           onclick="return confirm('Xóa bàn này?')">Xóa</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chuyển bàn -->
    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">🔄 Chuyển bàn</div>
        <div class="card-body">
            <form class="row g-2" method="post" action="/ban/chuyen">
                <div class="col-md-5">
                    <select name="mabanCu" class="form-select" required>
                        <option value="">-- Bàn đang có khách --</option>
                        <th:block th:each="b : ${dsBan}">
                            <option th:if="${b['Trangthai'] == 'Có khách'}" th:value="${b['Maban']}"
                                    th:text="${b['Tenban']} + ' (' + ${b['Mahd']} + ')'"></option>
                        </th:block>
                    </select>
                </div>
                <div class="col-md-5">
                    <select name="mabanMoi" class="form-select" required>
                        <option value="">-- Chuyển sang bàn trống --</option>
                        <option th:each="b : ${dsBanTrong}" th:value="${b['Maban']}" th:text="${b['Tenban']}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-grid"><button class="btn btn-warning fw-bold">Chuyển</button></div>
            </form>
        </div>
    </div>

    <!-- Modal thêm -->
    <div class="modal fade" id="modalThem" tabindex="-1">
        <div class="modal-dialog"><form class="modal-content" method="post" action="/ban/them">
            <div class="modal-header"><h5 class="modal-title">Thêm bàn</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input class="form-control mb-2" name="maban" placeholder="Mã bàn (vd: b11)" required>
                <input class="form-control mb-2" name="tenban" placeholder="Tên bàn" required>
                <select class="form-select" name="khuvuc">
                    <option th:each="kv : ${dsKhuVuc}" th:value="${kv}" th:text="${kv}"></option>
                </select>
            </div>
            <div class="modal-footer"><button class="btn btn-success">Lưu</button></div>
        </form></div>
    </div>

    <!-- Modal sửa -->
    <div class="modal fade" id="modalSua" tabindex="-1">
        <div class="modal-dialog"><form class="modal-content" method="post" action="/ban/sua">
            <div class="modal-header"><h5 class="modal-title">Sửa bàn</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input class="form-control mb-2" name="maban" id="suaMa" readonly>
                <input class="form-control mb-2" name="tenban" id="suaTen" required>
                <select class="form-select" name="khuvuc" id="suaKv">
                    <option th:each="kv : ${dsKhuVuc}" th:value="${kv}" th:text="${kv}"></option>
                </select>
            </div>
            <div class="modal-footer"><button class="btn btn-primary">Cập nhật</button></div>
        </form></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function moSua(btn) {
            document.getElementById('suaMa').value = btn.dataset.maban;
            document.getElementById('suaTen').value = btn.dataset.tenban;
            document.getElementById('suaKv').value = btn.dataset.khuvuc;
            new bootstrap.Modal(document.getElementById('modalSua')).show();
        }
    </script>
</section>
</body>
</html>
