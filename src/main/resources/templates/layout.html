<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">QLCafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow"
     th:with="quyen=${currentUser != null and currentUser['Taikhoan'] != null ? currentUser['Taikhoan']['Quyen'] : ''}">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">☕ QLCafe NoSQL</a>
        <div class="collapse navbar-collapse show" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 flex-row flex-wrap gap-1" th:if="${currentUser != null}">
                <li class="nav-item" th:if="${quyen != 'Pha chế'}">
                    <a class="nav-link px-2" th:href="@{/banhang}">POS</a>
                </li>
                <li class="nav-item" th:if="${quyen != 'Pha chế'}">
                    <a class="nav-link px-2" th:href="@{/ban}">Bàn</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" th:href="@{/mon}">Thực đơn</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" th:href="@{/danhmuc}">Danh mục</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" th:href="@{/nguyenlieu}">Kho NL</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" th:href="@{/phieunhap}">Phiếu nhập</a>
                </li>
                <li class="nav-item" th:if="${quyen != 'Pha chế'}">
                    <a class="nav-link px-2" th:href="@{/khachhang}">Khách hàng</a>
                </li>
                <li class="nav-item" th:if="${quyen != 'Pha chế'}">
                    <a class="nav-link px-2" th:href="@{/thongke}">Thống kê</a>
                </li>
                <li class="nav-item" th:if="${quyen == 'Quản lý'}">
                    <a class="nav-link px-2" th:href="@{/nhanvien}">Nhân viên</a>
                </li>
                <li class="nav-item" th:if="${quyen == 'Quản lý'}">
                    <a class="nav-link px-2" th:href="@{/saoluu}">Sao lưu</a>
                </li>
            </ul>
            <div class="d-flex align-items-center ms-auto">
                <span class="navbar-text me-3 text-white small" th:if="${currentUser != null}"
                      th:text="'Xin chào, ' + ${currentUser['Hoten']} + ' (' + ${quyen} + ')'"></span>
                <a class="btn btn-outline-danger btn-sm fw-bold" th:href="@{/logout}">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>
<div class="container">
    <!-- Nội dung các trang con sẽ được chèn vào đây -->
    <div th:replace="${content}"></div>
</div>
</body>
</html>
