<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">QLCafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">☕ QLCafe NoSQL</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3 text-white" th:if="${currentUser != null}" th:text="'Xin chào, ' + ${currentUser['Hoten']}"></span>
            <a class="btn btn-outline-danger btn-sm fw-bold" href="/logout">Đăng xuất</a>
        </div>
    </div>
</nav>
<div class="container">
    <!-- Nội dung các trang con sẽ được chèn vào đây -->
    <div th:replace="${content}"></div>
</div>
</body>
</html>
