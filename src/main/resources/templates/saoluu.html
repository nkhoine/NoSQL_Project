<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Sao lưu &amp; Phục hồi - QLCafe</title></head>
<body>
<section class="pb-4">
    <div class="mb-3">
        <h3 class="fw-bold mb-0">💾 Sao lưu, Phục hồi &amp; Import/Export</h3>
        <small class="text-muted">Thực thi mongodump/mongorestore hoặc JSON fallback trên 8 collections</small>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">
        <!-- Backup / Restore toàn bộ DB -->
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">🗄️ Toàn bộ Database (QLCafe)</div>
                <div class="card-body">
                    <p class="small text-muted mb-3">
                        Thư mục lưu Backup: <code th:text="${backupDir}">D:/MONGO/BACKUP/fulldb</code>
                    </p>
                    <div class="d-grid gap-2">
                        <form method="post" th:action="@{/saoluu/backup}">
                            <button type="submit" class="btn btn-primary w-100 fw-semibold">
                                ⬇ Sao lưu toàn bộ DB (Backup)
                            </button>
                        </form>
                        <form method="post" th:action="@{/saoluu/restore}"
                              onsubmit="return confirm('Phục hồi sẽ ghi đè dữ liệu hiện tại. Tiếp tục?')">
                            <button type="submit" class="btn btn-outline-danger w-100 fw-semibold">
                                ⬆ Phục hồi toàn bộ DB (Restore)
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export / Import từng Collection -->
        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">📦 Export / Import JSON theo Collection</div>
                <div class="card-body">
                    <p class="small text-muted mb-3">
                        Thư mục Export/Import: <code th:text="${exportDir}">D:/MONGO/EXPORT/QLCafe</code>
                    </p>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Collection</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${collections}">
                                <td><code class="fw-bold" th:text="${c}">collection</code></td>
                                <td class="text-end text-nowrap">
                                    <form method="post" th:action="@{/saoluu/export}" class="d-inline">
                                        <input type="hidden" name="collection" th:value="${c}">
                                        <button type="submit" class="btn btn-sm btn-outline-success">Export JSON</button>
                                    </form>
                                    <form method="post" th:action="@{/saoluu/import}" class="d-inline"
                                          onsubmit="return confirm('Import sẽ ghi đè dữ liệu collection này. Tiếp tục?')">
                                        <input type="hidden" name="collection" th:value="${c}">
                                        <button type="submit" class="btn btn-sm btn-outline-warning">Import JSON</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
