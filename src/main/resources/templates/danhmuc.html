<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Danh mục - QLCafe</title></head>
<body>
<section class="pb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 fw-bold mb-0">Danh mục món</h1>
        <a th:href="@{/mon}" class="btn btn-outline-secondary">Về thực đơn và kho</a>
    </div>
    <div th:if="${success}" th:text="${success}" class="alert alert-success" role="status"></div>
    <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

    <div class="row g-3 mb-3">
        <div class="col-lg-7">
            <form th:action="@{/danhmuc/them}" method="post" class="card card-body shadow-sm h-100">
                <h2 class="h5">Thêm danh mục</h2>
                <div class="row g-2">
                    <label class="col-md-3">Mã <input name="madm" class="form-control" required></label>
                    <label class="col-md-5">Tên danh mục <input name="tendm" class="form-control" required></label>
                    <label class="col-md-4">Danh mục cha
                        <select name="madmCha" class="form-select">
                            <option value="">Danh mục gốc</option>
                            <option th:each="dm : ${dsDanhMuc}" th:value="${dm['Madm']}" th:text="${dm['Tendm']}"></option>
                        </select>
                    </label>
                </div>
                <div class="mt-3"><button class="btn btn-success" type="submit">Lưu danh mục</button></div>
            </form>
        </div>
        <div class="col-lg-5">
            <form th:action="@{/danhmuc/themcon}" method="post" class="card card-body shadow-sm h-100">
                <h2 class="h5">Gắn danh mục con</h2>
                <div class="row g-2">
                    <label class="col-sm-6">Danh mục cha
                        <select name="madmCha" class="form-select" required>
                            <option value="">Chọn danh mục</option>
                            <option th:each="dm : ${dsDanhMuc}" th:value="${dm['Madm']}" th:text="${dm['Tendm']}"></option>
                        </select>
                    </label>
                    <label class="col-sm-6">Danh mục con
                        <select name="madmCon" class="form-select" required>
                            <option value="">Chọn danh mục</option>
                            <option th:each="dm : ${dsDanhMuc}" th:value="${dm['Madm']}" th:text="${dm['Tendm']}"></option>
                        </select>
                    </label>
                </div>
                <div class="mt-3"><button class="btn btn-outline-success" type="submit">Gắn danh mục con</button></div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Mã</th><th>Tên danh mục</th><th>Danh mục con</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="dm : ${dsDanhMuc}">
                    <td th:text="${dm['Madm']}"></td>
                    <td th:text="${dm['Tendm']}"></td>
                    <td>
                        <span th:each="con : ${dm['Con']}" class="badge text-bg-light border me-1" th:text="${con}"></span>
                        <span th:if="${#lists.isEmpty(dm['Con'])}" class="text-muted">—</span>
                    </td>
                    <td>
                        <details>
                            <summary>Sửa danh mục</summary>
                            <form th:action="@{/danhmuc/sua}" method="post" class="mt-2">
                                <input type="hidden" name="madm" th:value="${dm['Madm']}">
                                <div class="input-group input-group-sm">
                                    <input name="tendm" class="form-control" aria-label="Tên danh mục" th:value="${dm['Tendm']}" required>
                                    <button type="submit" class="btn btn-outline-primary">Lưu</button>
                                </div>
                            </form>
                        </details>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(dsDanhMuc)}"><td colspan="4" class="text-muted">Chưa có danh mục.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
