<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - QLCafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="card p-4 shadow-lg" style="width: 400px; border-radius: 15px;">
    <h4 class="text-center fw-bold mb-4 text-primary">QLCAFE ĐĂNG NHẬP</h4>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <form method="post" action="/login">
        <div class="mb-3">
            <label class="form-label fw-bold">Tên đăng nhập</label>
            <input type="text" name="tendn" class="form-control" placeholder="Vui lòng nhập tên đăng nhập" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Mật khẩu</label>
            <input type="password" name="matkhau" class="form-control" placeholder="123456" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">ĐĂNG NHẬP</button>
    </form>
</div>
</body>
</html>
