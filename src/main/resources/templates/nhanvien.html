<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Quản lý nhân viên - QLCafe</title></head>
<body>
<section class="pb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h3 class="fw-bold mb-0">👤 Quản lý nhân viên &amp; Tài khoản</h3>
            <small class="text-muted">Phân quyền Quản lý / Thu ngân / Pha chế (mã hóa SHA-256)</small>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalThem">+ Thêm nhân viên</button>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Thống kê theo quyền (Aggregate) -->
    <div class="row g-3 mb-4" th:if="${!#lists.isEmpty(thongKeQuyen)}">
        <div class="col-md-4" th:each="tk : ${thongKeQuyen}">
            <div class="card shadow-sm border-start border-4 border-primary">
                <div class="card-body py-2 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold" th:text="${tk['_id'] ?: 'Chưa phân quyền'}">Quyền</span>
                    <span class="badge text-bg-primary fs-6" th:text="${tk['Soluong']} + ' NV'">0 NV</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Danh sách nhân viên -->
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã NV</th>
                    <th>Họ tên</th>
                    <th>Phái</th>
                    <th>Ngày sinh</th>
                    <th>Điện thoại</th>
                    <th>Tên ĐN</th>
                    <th>Quyền</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="nv : ${dsNhanVien}"
                    th:with="tk=${nv['Taikhoan']}, ngaysinh=${nv['Ngaysinh'] != null ? #dates.format(nv['Ngaysinh'], 'yyyy-MM-dd') : ''}">
                    <td class="fw-bold" th:text="${nv['Manv']}">nv01</td>
                    <td th:text="${nv['Hoten']}">Họ tên</td>
                    <td th:text="${nv['Phai']}">Nam</td>
                    <td th:text="${nv['Ngaysinh'] != null ? #dates.format(nv['Ngaysinh'], 'dd/MM/yyyy') : '—'}"></td>
                    <td th:text="${nv['Dienthoai']}"></td>
                    <td><code th:text="${tk != null ? tk['Tendn'] : ''}"></code></td>
                    <td>
                        <span class="badge text-bg-info" th:text="${tk != null ? tk['Quyen'] : ''}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${tk != null and tk['Trangthai'] == 'Hoạt động'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${tk != null ? tk['Trangthai'] : ''}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                th:attr="data-manv=${nv['Manv']},data-hoten=${nv['Hoten']},data-phai=${nv['Phai']},data-ngaysinh=${ngaysinh},data-dienthoai=${nv['Dienthoai']},data-quyen=${tk != null ? tk['Quyen'] : 'Thu ngân'},data-trangthai=${tk != null ? tk['Trangthai'] : 'Hoạt động'}"
                                onclick="moSuaNV(this)">Sửa</button>
                        <a class="btn btn-sm btn-outline-warning"
                           th:href="@{/nhanvien/khoa/{ma}(ma=${nv['Manv']})}"
                           th:text="${tk != null and tk['Trangthai'] == 'Hoạt động'} ? 'Khóa' : 'Mở'">Khóa</a>
                        <a class="btn btn-sm btn-outline-danger"
                           th:if="${nv['Manv'] != 'nv01'}"
                           th:href="@{/nhanvien/xoa/{ma}(ma=${nv['Manv']})}"
                           onclick="return confirm('Xóa nhân viên này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(dsNhanVien)}">
                    <td colspan="9" class="text-center text-muted">Chưa có nhân viên nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal thêm nhân viên -->
    <div class="modal fade" id="modalThem" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/nhanvien/them}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Thêm nhân viên mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Mã NV</label>
                            <input name="manv" class="form-control" placeholder="vd: nv07" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Họ tên</label>
                            <input name="hoten" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Phái</label>
                            <select name="phai" class="form-select">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Ngày sinh</label>
                            <input type="date" name="ngaysinh" class="form-control" value="2002-01-01" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Điện thoại</label>
                            <input name="dienthoai" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Tên đăng nhập</label>
                            <input name="tendn" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Mật khẩu</label>
                            <input type="password" name="matkhau" class="form-control" value="123456" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Quyền hạn</label>
                            <select name="quyen" class="form-select">
                                <option value="Thu ngân">Thu ngân</option>
                                <option value="Pha chế">Pha chế</option>
                                <option value="Quản lý">Quản lý</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Lưu nhân viên</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal sửa nhân viên -->
    <div class="modal fade" id="modalSua" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/nhanvien/sua}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Cập nhật nhân viên</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Mã NV</label>
                            <input name="manv" id="suaManv" class="form-control" readonly>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Họ tên</label>
                            <input name="hoten" id="suaHoten" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Phái</label>
                            <select name="phai" id="suaPhai" class="form-select">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Ngày sinh</label>
                            <input type="date" name="ngaysinh" id="suaNgaysinh" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Điện thoại</label>
                            <input name="dienthoai" id="suaDienthoai" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Quyền hạn</label>
                            <select name="quyen" id="suaQuyen" class="form-select">
                                <option value="Thu ngân">Thu ngân</option>
                                <option value="Pha chế">Pha chế</option>
                                <option value="Quản lý">Quản lý</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Trạng thái</label>
                            <select name="trangthai" id="suaTrangthai" class="form-select">
                                <option value="Hoạt động">Hoạt động</option>
                                <option value="Khóa">Khóa</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Mật khẩu mới (để trống nếu không đổi)</label>
                            <input type="password" name="matkhauMoi" class="form-control" placeholder="Nhập mật khẩu mới nếu muốn đặt lại">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function moSuaNV(btn) {
            document.getElementById('suaManv').value = btn.dataset.manv;
            document.getElementById('suaHoten').value = btn.dataset.hoten;
            document.getElementById('suaPhai').value = btn.dataset.phai;
            document.getElementById('suaNgaysinh').value = btn.dataset.ngaysinh;
            document.getElementById('suaDienthoai').value = btn.dataset.dienthoai;
            document.getElementById('suaQuyen').value = btn.dataset.quyen;
            document.getElementById('suaTrangthai').value = btn.dataset.trangthai;
            new bootstrap.Modal(document.getElementById('modalSua')).show();
        }
    </script>
</section>
</body>
</html>
